<!DOCTYPE html>
<!--
    index.html: pantalla principal (como la Figura 1 del enunciado): arriba una barra con los botones
    "Añadir categoría" y "Añadir site"; debajo, las categorías a la izquierda y los sites de la categoría a la derecha.
    Solo contiene ESTRUCTURA (lección 49): ningún JavaScript dentro del HTML, ni <script> con código ni onclick=.
    El código irá en archivos aparte (js/...) cargados al final del body.
    Los id llevan prefijo según el tipo de elemento, como en el lab (lección 51): txt (cuadro de texto),
    btn (botón), l (etiqueta de texto), ul (lista), tbl (tabla).
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de contraseñas</title>
    <!-- La apariencia va en un archivo aparte (lección 49) -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>Gestor de contraseñas</h1>
    </header>

    <!-- Mensaje de error del servidor (en rojo). Empieza vacío y se rellena desde JavaScript -->
    <p id="lMensaje"></p>

    <!-- Barra de botones (Figura 1). "Añadir site" empieza desactivado: hace falta una categoría seleccionada -->
    <div class="barra">
        <button id="btnNuevaCategoria" type="button" class="principal">Añadir categoría</button>
        <button id="btnNuevoSite" type="button" disabled>Añadir site</button>

        <!-- EXTRA 2: buscador. Filtra a la vez las categorías y los sites que ya están pintados -->
        <input type="text" id="txtBuscar" placeholder="Buscar categorías y sites...">
    </div>

    <!-- main: contenedor de las dos columnas (lección 49) -->
    <main>

        <!-- COLUMNA IZQUIERDA: categorías. Aquí se pintan (una <li> por cada una) -->
        <section id="columnaCategorias">
            <h2>Categorías</h2>
            <ul id="ulCategorias"></ul>
        </section>

        <!-- COLUMNA DERECHA: sites de la categoría seleccionada -->
        <section id="columnaSites">
            <h2 id="lTituloSites">Selecciona una categoría</h2>

            <!-- Texto que se muestra cuando la categoría no tiene sites -->
            <p id="lSinSites"></p>

            <!-- OBLIGATORIO 3: tabla de sites. El <tbody> se rellena desde JavaScript -->
            <table id="tblSites" hidden>
                <thead>
                    <tr>
                        <th>Sitio</th>
                        <th>Usuario</th>
                        <th>Creado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodySites"></tbody>
            </table>
        </section>

    </main>

    <!-- OBLIGATORIO 1: cuadro "Nueva categoría" (Figura 2). Oculto hasta pulsar "Añadir categoría".
         El fondo oscuro ocupa toda la pantalla y el cuadro va centrado encima -->
    <div id="fondoDialogo" class="fondo" hidden>
        <div class="dialogo">
            <h3>Nueva categoría</h3>
            <label for="txtCategoria">Nombre</label>
            <input type="text" id="txtCategoria">
            <!-- Aquí irá el mensaje de validación de este campo -->
            <p id="lErrorCategoria" class="error"></p>
            <div class="botones">
                <button id="btnCancelarCategoria" type="button">Cancelar</button>
                <button id="btnAceptarCategoria" type="button" class="principal">OK</button>
            </div>
        </div>
    </div>

    <!-- Los scripts van al final del body, cuando los elementos ya existen (lección 49). Orden: api, validación, pantalla -->
    <script src="js/api.js"></script>
    <script src="js/validacion.js"></script>
    <script src="js/index.js"></script>

</body>
</html>
